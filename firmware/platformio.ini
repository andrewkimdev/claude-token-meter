; Claude Token Meter firmware -- LilyGO T-Display (classic ESP32).
; Known-good config from docs/HARDWARE.md §6.4. Do not regress.
; gotcha 3.13: keep ALL options above any additional [env:...] header.
[env:t-display]
platform  = espressif32@^6.5.0
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

upload_port  = /dev/cu.usbserial-59150189961
monitor_port = /dev/cu.usbserial-59150189961
upload_speed = 460800          ; 921600 fails with the macOS built-in driver

; Single entry point src/app/main.cpp (gotcha 3.14).
build_src_filter = +<*>

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

; --- 16MB flash: gotcha 3.8. Applied after full erase [V] ---
board_upload.flash_size = 16MB
board_build.partitions  = partitions_16mb.csv

; ---------------------------------------------------------------------------
; Native (Mac) unit tests for the Arduino-free core (P2). Must stay BELOW
; [env:t-display] (gotcha 3.13): nothing here may leak into the device env.
; Builds only src/core/ + test/ (gotcha 3.14). Run:
;   ~/.platformio/penv/bin/pio test -d firmware -e native
[env:native]
platform         = native
test_framework   = unity
test_build_src   = yes
build_src_filter = +<core/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
    -DFIXTURES_DIR=\"$PROJECT_DIR/../fixtures\"
